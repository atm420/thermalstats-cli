[package]
name = "thermalstats"
version = "2.0.0-beta.2"
edition = "2021"
description = "ThermalStats — stress test your CPU/GPU and submit real temperatures"
license = "MIT"

[[bin]]
name = "thermalstats"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client for submitting results (blocking: requests run on worker threads)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System info (CPU model, cores, OS, etc.)
sysinfo = "0.32"

# Full-screen terminal interface
ratatui = "0.30"
unicode-width = "0.2"

# Colored output for the plain (non-interactive) mode
colored = "2"

# Error handling
anyhow = "1"

# Number of CPUs (logical cores)
num_cpus = "1"

# OS locale detection
sys-locale = "0.3"

# Machine hostname for contributor ID
hostname = "0.4"

# Timestamp for debug logs
chrono = "0.4"

# WebGPU for cross-platform GPU compute stress (Vulkan/Metal/DX12)
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# NVIDIA temperatures/usage in-process (loads nvml.dll / libnvidia-ml at runtime)
nvml-wrapper = "0.13"

[target.'cfg(windows)'.dependencies]
# WMI for reading GPU info and temperatures on Windows
wmi = "0.14"

# Zip extraction for embedded LHM bundle
zip = { version = "2", default-features = false, features = ["deflate"] }

# Thread priority, console mode, power status, registry, clipboard
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Thread priority (nice / QoS) for the stress workers
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
